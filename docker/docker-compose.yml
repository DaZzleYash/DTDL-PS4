services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: decisions
      POSTGRES_PASSWORD: decisions
      POSTGRES_DB: decisions
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decisions -d decisions"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://decisions:decisions@postgres:5432/decisions
      LOG_LEVEL: INFO
      APP_ENV: docker
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../data:/app/data

volumes:
  postgres_data:
