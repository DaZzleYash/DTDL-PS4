# Render Blueprint — one-click deploy: Dashboard → New → Blueprint → connect this repo
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: dtdl-ps4-db
    databaseName: decisions
    user: decisions
    plan: free

services:
  - type: web
    name: dtdl-ps4-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m app.finance.seed_rules && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dtdl-ps4-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: "*"
